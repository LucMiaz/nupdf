[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nupdf"
version = "1.0.0"
description = "Merge, rotate and reorder PDF/image files from a GUI or Python API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["pdf", "merge", "rotate", "pypdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pypdf>=4.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=7.0", "pytest-cov", "pylint>=3.0", "pyinstaller"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "sphinx-autoapi>=3.0"]

[project.scripts]
nupdf = "nupdf.gui:main"

[tool.setuptools.packages.find]
include = ["nupdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.pylint.main]
jobs = 1

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring (already have them)
    "R0903",  # too-few-public-methods
]
