name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.2.3

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nuPDF-windows.exe
            pyinstaller_args: "--onefile --windowed --name=nuPDF"
            bin_path: dist/nuPDF.exe

          - os: ubuntu-latest
            artifact_name: nuPDF-ubuntu
            pyinstaller_args: "--onefile --windowed --name=nuPDF"
            bin_path: dist/nuPDF

          - os: macos-latest
            artifact_name: nuPDF-macos
            pyinstaller_args: "--onefile --windowed --name=nuPDF"
            bin_path: dist/nuPDF

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and build dependencies
        run: pip install ".[gui,dev]"

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.pyinstaller_args }} nupdf/gui.py

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.bin_path }}" "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/nuPDF-windows.exe/nuPDF-windows.exe
            dist/nuPDF-ubuntu/nuPDF-ubuntu
            dist/nuPDF-macos/nuPDF-macos
